<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Del pliegue al mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Paleta: reemplazar por los colores del Ministerio ===== */
  :root{
    --primario:#0a6fb5;      /* botones y elementos activos */
    --acento:#ffcc00;        /* resaltados */
    --linea-nueva:#e5532d;   /* línea que aparece en el paso actual */
    --linea-vieja:#7d8597;   /* líneas de pasos anteriores */
    --texto:#1d2a44;
    --fondo:#f4f6fa;
    --tarjeta:#ffffff;
    --borde:#dde3ec;
    --papel-mariposa:#d8c9f0;
    --papel-ballena:#c3e2f5;
    --trazo:#2b3352;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--texto);background:var(--fondo);line-height:1.4}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 32px}
  header{text-align:center;margin-bottom:18px}
  h1{font-size:clamp(1.6rem,4vw,2.2rem);margin:0 0 6px;font-weight:800}
  header p{margin:0;font-size:1.05rem;opacity:.85}

  .tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
  .tab{font:inherit;font-weight:700;font-size:1.05rem;border:2px solid var(--borde);background:var(--tarjeta);color:var(--texto);
       padding:10px 22px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:48px}
  .tab .dot{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--trazo)}
  .tab[aria-selected="true"]{border-color:var(--primario);background:var(--primario);color:#fff}

  .stepbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .stepdot{font:inherit;font-weight:800;width:42px;height:42px;border-radius:50%;border:2px solid var(--borde);
           background:var(--tarjeta);color:var(--texto);cursor:pointer}
  .stepdot.done{border-color:var(--primario);color:var(--primario)}
  .stepdot[aria-current="step"]{background:var(--primario);border-color:var(--primario);color:#fff}

  .panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:720px){.panels{grid-template-columns:1fr}}
  .card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;padding:14px;display:flex;flex-direction:column}
  .card h2{font-size:1.1rem;margin:0 0 8px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
  .card h2 small{font-weight:700;opacity:.7;font-size:.95rem}
  .stage{position:relative;aspect-ratio:1/1;width:100%}
  .stage svg{width:100%;height:100%;display:block}

  /* Tarjeta que se da vuelta para "desplegar" */
  .flip{perspective:1200px}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
  .flip.open .flip-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px}
  .face.back{transform:rotateY(180deg)}
  .face.front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:repeating-linear-gradient(45deg,#f7f9fc 0 12px,#eef2f8 12px 24px)}
  .face.front p{margin:0 18px;text-align:center;font-size:1.02rem}

  .btn{font:inherit;font-weight:800;font-size:1.05rem;border:none;border-radius:999px;padding:12px 24px;cursor:pointer;min-height:48px}
  .btn.main{background:var(--primario);color:#fff}
  .btn.ghost{background:transparent;border:2px solid var(--borde);color:var(--texto);font-size:.95rem;padding:8px 16px;min-height:42px}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}

  .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:.92rem;margin-top:8px}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{display:inline-block;width:26px;height:0;border-top:4px solid var(--linea-nueva);border-radius:2px}
  .legend i.old{border-top:2px solid var(--linea-vieja)}

  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}

  /* SVG */
  .paper{stroke:var(--trazo);stroke-width:2;stroke-linejoin:round}
  .paper.light{fill-opacity:.55}
  .sombra{fill:none;stroke:var(--trazo);stroke-width:1.5;stroke-dasharray:4 5;opacity:.35}
  .crease{stroke:var(--trazo);stroke-width:1.3;opacity:.55;fill:none}
  .fold{stroke:var(--linea-nueva);stroke-width:2.6;stroke-dasharray:9 6;fill:none;stroke-linecap:round}
  .arrow{stroke:var(--trazo);stroke-width:2.4;fill:none;stroke-linecap:round}
  .old-line{stroke:var(--linea-vieja);stroke-width:2;stroke-linecap:round}
  .new-line{stroke:var(--linea-nueva);stroke-width:4.5;stroke-linecap:round}
  .new-line.anim{animation:draw 1s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .map-g{transition:transform .5s ease}
  @media (prefers-reduced-motion:reduce){.flip-inner,.map-g{transition:none}.new-line.anim{animation:none;stroke-dashoffset:0!important}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Del pliegue al mapa</h1>
    <p>Elijan una figura, avancen de a un paso y desplieguen el papel para ver qué línea aparece.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Elegir figura">
    <button class="tab" role="tab" data-fig="mariposa"><span class="dot" style="background:var(--papel-mariposa)"></span>Mariposa</button>
    <button class="tab" role="tab" data-fig="ballena"><span class="dot" style="background:var(--papel-ballena)"></span>Ballena</button>
  </div>

  <nav class="stepbar" id="stepbar" aria-label="Pasos"></nav>

  <div class="panels">
    <section class="card">
      <h2>Así se dobla <small id="stepLabel"></small></h2>
      <div class="stage"><svg id="diagram" viewBox="0 0 300 300" role="img" aria-label="Diagrama del paso"></svg></div>
    </section>

    <section class="card">
      <h2>El papel desplegado</h2>
      <div class="stage flip" id="flip">
        <div class="flip-inner">
          <div class="face front">
            <svg viewBox="0 0 120 90" width="120" aria-hidden="true">
              <polygon points="10,80 60,10 110,80" fill="var(--acento)" stroke="var(--trazo)" stroke-width="2.5" stroke-linejoin="round"/>
              <line x1="60" y1="10" x2="60" y2="80" stroke="var(--trazo)" stroke-width="1.5" opacity=".5"/>
            </svg>
            <p>¿Qué línea nueva creen que va a aparecer en este paso?</p>
            <button class="btn main" id="unfoldBtn">Desplegar el papel</button>
          </div>
          <div class="face back">
            <svg id="map" viewBox="-50 -50 400 400" role="img" aria-label="Mapa de pliegues"></svg>
          </div>
        </div>
      </div>
      <div class="legend"><span><i></i>Línea de este paso</span><span><i class="old"></i>Líneas de pasos anteriores</span></div>
      <div class="row">
        <button class="btn ghost" id="refoldBtn" disabled>Volver a plegar</button>
        <button class="btn ghost" id="rotateBtn" disabled>Girar el papel ↻</button>
      </div>
    </section>
  </div>

  <div class="nav">
    <button class="btn ghost" id="prevBtn">← Paso anterior</button>
    <button class="btn main" id="nextBtn">Paso siguiente →</button>
  </div>
</div>

<script>
/* ---------- Ayudas para dibujar ---------- */
const P = pts => pts.map(p=>p.join(',')).join(' ');
const poly = (pts,fill,cls='paper') => `<polygon class="${cls}" points="${P(pts)}" fill="${fill}"/>`;
const ln = (a,b,cls) => `<line class="${cls}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
const arrow = (d,both=false) => `<path class="arrow" d="${d}" marker-end="url(#ah)" ${both?'marker-start="url(#ahs)"':''}/>`;
const DEFS = `<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--trazo)"/></marker>
  <marker id="ahs" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--trazo)"/></marker>
</defs>`;
const flipIcon = (x,y) => `<g transform="translate(${x},${y})"><circle r="17" fill="var(--acento)" stroke="var(--trazo)" stroke-width="1.5"/>
  <path class="arrow" d="M -8 -3 A 9 9 0 0 1 8 -3" marker-end="url(#ah)" style="stroke-width:2"/>
  <path class="arrow" d="M 8 4 A 9 9 0 0 1 -8 4" marker-end="url(#ah)" style="stroke-width:2"/></g>`;

const VM = 'var(--papel-mariposa)', VB = 'var(--papel-ballena)';

/* ---------- MARIPOSA ---------- */
/* Mapa: cuadrado de 10 a 290. C = centro (150,150). */
const mariposaSteps = [
  { // 1. mitades
    svg: poly([[40,40],[260,40],[260,260],[40,260]],VM)
       + ln([150,40],[150,260],'fold') + ln([40,150],[260,150],'fold')
       + arrow('M 95 95 Q 150 45 205 95',true) + arrow('M 95 105 Q 45 150 95 205',true),
    lines: [[[150,10],[150,290]], [[10,150],[290,150]]]
  },
  { // 2. diagonales
    svg: poly([[40,40],[260,40],[260,260],[40,260]],VM)
       + ln([150,40],[150,260],'crease') + ln([40,150],[260,150],'crease')
       + ln([40,40],[260,260],'fold') + ln([260,40],[40,260],'fold')
       + flipIcon(262,30),
    lines: [[[10,10],[290,290]], [[290,10],[10,290]]]
  },
  { // 3. formar el triángulo
    svg: `<rect class="sombra" x="40" y="40" width="220" height="220"/>`
       + poly([[40,225],[260,225],[150,115]],VM) + ln([150,115],[150,225],'crease')
       + arrow('M 22 150 Q 50 185 95 182') + arrow('M 278 150 Q 250 185 205 182'),
    lines: []
  },
  { // 4. puntas de adelante hacia arriba
    svg: poly([[30,230],[270,230],[150,110]],VM) + ln([150,110],[150,230],'crease')
       + ln([150,230],[90,170],'fold') + ln([150,230],[210,170],'fold')
       + arrow('M 42 222 Q 70 140 140 118') + arrow('M 258 222 Q 230 140 160 118'),
    lines: [[[150,290],[80,220]], [[10,150],[80,220]], [[150,290],[220,220]], [[290,150],[220,220]]]
  },
  { // 5. dar vuelta, punta hacia arriba pasando el borde
    svg: poly([[30,90],[270,90],[150,210]],VM) + ln([150,90],[150,210],'crease')
       + ln([82,142],[218,142],'fold')
       + arrow('M 150 202 Q 205 140 154 74') + flipIcon(262,232),
    lines: [[[70.7,70.7],[229.3,70.7]], [[70.7,70.7],[70.7,150]], [[229.3,70.7],[229.3,150]]]
  },
  { // 6. trabar la puntita
    svg: poly([[30,90],[270,90],[218,142],[82,142]],VM) + ln([150,90],[150,142],'crease')
       + poly([[82,142],[218,142],[150,74]],VM,'paper light')
       + ln([126,90],[174,90],'fold')
       + arrow('M 158 70 Q 200 66 178 112'),
    lines: [[[131.3,131.3],[168.7,131.3]], [[131.3,131.3],[131.3,150]], [[168.7,131.3],[168.7,150]]]
  },
  { // 7. doblar por la mitad
    svg: poly([[30,90],[270,90],[218,142],[82,142]],VM)
       + poly([[134,90],[166,90],[150,106]],VM,'paper light')
       + ln([150,70],[150,160],'fold')
       + arrow('M 240 118 Q 150 190 60 118'),
    lines: []
  },
  { // 8. mariposa lista
    svg: poly([[150,122],[38,62],[96,168]],VM) + poly([[150,122],[262,62],[204,168]],VM)
       + poly([[150,140],[96,168],[124,246]],VM) + poly([[150,140],[204,168],[176,246]],VM)
       + `<rect x="144" y="112" width="12" height="96" rx="6" fill="${VM}" stroke="var(--trazo)" stroke-width="2"/>`,
    lines: []
  }
];

/* ---------- BALLENA ---------- */
/* Mapa: rombo T(150,10) R(290,150) B(150,290) L(10,150). Cola: 4 cm sobre 15 cm. */
const ballenaSteps = [
  { // 1. diagonal
    svg: poly([[150,30],[270,150],[150,270],[30,150]],VB) + ln([150,30],[150,270],'fold')
       + arrow('M 80 175 Q 150 110 220 175',true),
    lines: [[[150,10],[150,290]]]
  },
  { // 2. cometa
    svg: poly([[150,30],[270,150],[150,270],[30,150]],VB) + ln([150,30],[150,270],'crease')
       + ln([150,270],[79.7,100.3],'fold') + ln([150,270],[220.3,100.3],'fold')
       + arrow('M 40 165 Q 70 205 132 190') + arrow('M 260 165 Q 230 205 168 190'),
    lines: [[[150,290],[68,92]], [[150,290],[232,92]]]
  },
  { // 3. bajar la punta de arriba
    svg: poly([[150,30],[220.3,100.3],[150,270],[79.7,100.3]],VB)
       + ln([150,30],[150,100.3],'crease') + ln([79.7,100.3],[150,100.3],'crease') + ln([220.3,100.3],[150,100.3],'crease') + ln([150,100.3],[150,270],'crease')
       + ln([112,65.2],[188,65.2],'fold')
       + arrow('M 154 34 Q 200 62 155 97'),
    lines: [[[109,51],[191,51]]]
  },
  { // 4. doblar por la mitad
    svg: poly([[114.8,65.2],[185.2,65.2],[220.3,100.3],[150,270],[79.7,100.3]],VB)
       + poly([[114.8,65.2],[185.2,65.2],[150,100.3]],VB,'paper light')
       + ln([79.7,100.3],[150,100.3],'crease') + ln([220.3,100.3],[150,100.3],'crease')
       + ln([150,55],[150,278],'fold')
       + arrow('M 212 165 Q 150 115 88 165'),
    lines: []
  },
  { // 5. cola hacia arriba (pliegue a 45° desde la marca de 4 cm)
    svg: poly([[22,210],[234.1,122.1],[278,166],[278,210]],VB)
       + ln([84,215.6],[55,186.6],'fold')
       + `<line x1="22" y1="226" x2="78.6" y2="226" stroke="var(--trazo)" stroke-width="1.5"/>
          <line x1="22" y1="220" x2="22" y2="232" stroke="var(--trazo)" stroke-width="1.5"/>
          <line x1="78.6" y1="216" x2="78.6" y2="232" stroke="var(--trazo)" stroke-width="1.5"/>
          <text x="50" y="250" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="15" fill="var(--trazo)">4 cm</text>`
       + arrow('M 30 200 Q 30 150 72 140'),
    lines: [[[150,237.2],[134.5,252.7]], [[134.5,252.7],[112.7,252.7]], [[150,237.2],[165.5,252.7]], [[165.5,252.7],[187.3,252.7]]]
  },
  { // 6. ballena lista
    svg: poly([[62,193.4],[234.1,122.1],[278,166],[278,210],[78.6,210]],VB)
       + poly([[78.6,210],[62,193.4],[78.6,153.4]],VB)
       + `<circle cx="250" cy="170" r="5" fill="var(--trazo)"/>`,
    lines: []
  }
];

const FIGS = {
  mariposa:{ steps:mariposaSteps, color:VM, paper:`<rect x="10" y="10" width="280" height="280" fill="${VM}" stroke="var(--trazo)" stroke-width="2.5"/>` },
  ballena:{ steps:ballenaSteps, color:VB, paper:`<polygon points="150,10 290,150 150,290 10,150" fill="${VB}" stroke="var(--trazo)" stroke-width="2.5" stroke-linejoin="round"/>` }
};

/* ---------- Estado ---------- */
const state = { fig:'mariposa', step:0, open:false, rot:0 };
const $ = id => document.getElementById(id);

function renderTabs(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.fig===state.fig));
}
function renderStepbar(){
  const n = FIGS[state.fig].steps.length;
  $('stepbar').innerHTML = Array.from({length:n},(_,i)=>
    `<button class="stepdot ${i<state.step?'done':''}" ${i===state.step?'aria-current="step"':''} data-i="${i}" aria-label="Paso ${i+1}">${i+1}</button>`).join('');
  $('stepbar').querySelectorAll('.stepdot').forEach(b=>b.onclick=()=>goTo(+b.dataset.i));
}
function renderDiagram(){
  const s = FIGS[state.fig].steps[state.step];
  $('diagram').innerHTML = DEFS + s.svg;
  $('stepLabel').textContent = `Paso ${state.step+1} de ${FIGS[state.fig].steps.length}`;
}
function renderMap(){
  const f = FIGS[state.fig];
  let old = '', neu = '';
  f.steps.forEach((s,i)=>{
    if(i<state.step) s.lines.forEach(l=> old += ln(l[0],l[1],'old-line'));
    if(i===state.step) s.lines.forEach(l=>{
      const len = Math.hypot(l[1][0]-l[0][0], l[1][1]-l[0][1]).toFixed(1);
      neu += `<line class="new-line ${state.open?'anim':''}" x1="${l[0][0]}" y1="${l[0][1]}" x2="${l[1][0]}" y2="${l[1][1]}" style="stroke-dasharray:${len};stroke-dashoffset:${state.open?len:0}"/>`;
    });
  });
  $('map').innerHTML = `<g class="map-g" style="transform-origin:150px 150px;transform:rotate(${state.rot}deg)">${f.paper}${old}${neu}</g>`;
}
function renderNav(){
  const n = FIGS[state.fig].steps.length;
  $('prevBtn').disabled = state.step===0;
  $('nextBtn').disabled = state.step===n-1;
  $('flip').classList.toggle('open', state.open);
  $('refoldBtn').disabled = !state.open;
  $('rotateBtn').disabled = !state.open;
  $('unfoldBtn').tabIndex = state.open?-1:0;
}
function render(){ renderTabs(); renderStepbar(); renderDiagram(); renderMap(); renderNav(); }

function goTo(i){ state.step=i; state.open=false; render(); }
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ state.fig=t.dataset.fig; state.step=0; state.open=false; state.rot=0; render(); });
$('prevBtn').onclick=()=>goTo(Math.max(0,state.step-1));
$('nextBtn').onclick=()=>goTo(Math.min(FIGS[state.fig].steps.length-1,state.step+1));
$('unfoldBtn').onclick=()=>{ state.open=true; renderMap(); renderNav(); };
$('refoldBtn').onclick=()=>{ state.open=false; renderNav(); };
$('rotateBtn').onclick=()=>{ state.rot=(state.rot+45)%360; const g=document.querySelector('.map-g'); if(g) g.style.transform=`rotate(${state.rot}deg)`; };

render();
</script>
</body>
</html>
